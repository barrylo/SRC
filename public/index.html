<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Daily Tasks</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <img src="/icon.svg" alt="Daily Tasks icon" class="app-icon" />
          <div>
            <h1>Daily Tasks</h1>
            <p class="lead">Manage your tasks with categories, priority, and a clean responsive experience.</p>
            <p><a href="/rental.html" style="color: var(--accent); font-weight:600;">Go to Rental Management</a></p>
          </div>
        </div>
      </header>
      <form id="task-form">
        <input id="title" placeholder="New task title" required />
        <input id="due" type="date" />
        <input id="category" placeholder="Category" />
        <select id="priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
        <button type="submit">Add</button>
      </form>

      <ul id="tasks"></ul>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
